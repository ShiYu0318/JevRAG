[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jevrag"
version = "0.1.0"
description = "Typed decision models as the judgment layer of RAG pipelines"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "ShiYu Huang"}]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/ShiYu0318/JevRAG"

[project.optional-dependencies]
zh = ["opencc"]
dense = ["sentence-transformers"]
yaml = ["pyyaml"]
dev = ["pytest"]

[project.scripts]
jevrag = "jevrag.cli:main"

[tool.setuptools.packages.find]
include = ["jevrag*"]
